name: Tests & Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Least-privilege default for the GITHUB_TOKEN: both jobs only read the
# repository and run tests, so read-only contents is all they need.
permissions:
  contents: read

jobs:
  quality:
    name: Static analysis, style & coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          extensions: mbstring, json, redis, bcmath, pdo_sqlite
          coverage: pcov

      - name: Install dependencies (locked, reproducible)
        # Deterministic single-version job: install the committed lock so style,
        # static analysis and coverage run against a fixed dependency set instead
        # of whatever floated to latest that day. Dependency bumps arrive
        # deliberately via Dependabot lock updates; the compatibility matrix below
        # still floats via `composer update`.
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Run PHPStan static analysis
        run: vendor/bin/phpstan analyse --error-format=github

      - name: Run Pest with coverage (min 90%)
        run: vendor/bin/pest --coverage --min=90

  test:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: [10, 11, 12, 13]
        include:
          - laravel: 10
            testbench: 8
          - laravel: 11
            testbench: 9
          - laravel: 12
            testbench: 10
          - laravel: 13
            testbench: 11
        exclude:
          # Laravel 13 (testbench 11) requires PHP >= 8.3
          - php: '8.2'
            laravel: 13
          # Laravel 10 supports PHP up to 8.3
          - php: '8.4'
            laravel: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, json, redis, bcmath, pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-laravel${{ matrix.laravel }}-

      - name: Install dependencies (Laravel ${{ matrix.laravel }})
        # --no-blocking: this is a cross-version *compatibility* matrix, so we
        # deliberately install older framework lines (Laravel 10/11) even when
        # Composer 2.9+ would block them for open security advisories. We are
        # exercising the package against those frameworks, not shipping them.
        # Vulnerable *latest* stables are caught by osv-scanner, dependency-review
        # and Dependabot rather than by this matrix.
        run: |
          composer require --dev "orchestra/testbench:^${{ matrix.testbench }}.0" --no-interaction --no-update
          composer update --prefer-stable --prefer-dist --no-interaction --no-progress --no-blocking

      - name: Execute Pest tests
        run: vendor/bin/pest
